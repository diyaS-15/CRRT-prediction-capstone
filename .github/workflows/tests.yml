name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  smoke-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate CI fixture dataset
        # The real dataset is DVC-tracked in a local-only remote, not
        # reachable from this runner -- this generates a same-shaped
        # throwaway dataset just to prove the pipeline runs end to end.
        run: python scripts/make_ci_fixture_data.py /tmp/ci_fixture.csv 200 1

      - name: Smoke-train XGBoost (canonical pipeline)
        env:
          BCQP_DATA_PATH: /tmp/ci_fixture.csv
          CRRT_TUNING_N_TRIALS: "3"
        run: python -m src.crrt.training.train_xgb
